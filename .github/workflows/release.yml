name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release from the selected branch (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        run: |
          pip install pyyaml
          ./scripts/setup-tools.sh
          python3 scripts/validate.py

      - name: Build release assets
        run: |
          python3 scripts/build-assistant.py
          mkdir -p out
          (cd dist && zip -qr ../out/roblox-assistant-skills.zip assistant)
          zip -qr out/roblox-skills.zip skills README.md LICENSE

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' entry"
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On a tag push the tag already exists; on a manual run gh creates it at this commit.
          gh release create "$TAG" out/*.zip \
            --title "Roblox Skills $TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
